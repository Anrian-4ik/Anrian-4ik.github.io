<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>OAuth redirect</title></head>
  <body>
    <h1>OAuth redirect page</h1>
    <p>Code will appear here: <span id="code"></span></p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) document.getElementById('code').textContent = code;
    </script>
  </body>
</html>
